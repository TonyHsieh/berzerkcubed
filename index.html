<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BERZERK³ — Berzerk Cubed</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #05070d; color: #e2e8f0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        user-select: none;
      }
      #app { position: relative; width: 100%; height: 100%; }
      canvas#game-canvas {
        display: block; width: 100%; height: 100%;
        image-rendering: pixelated; image-rendering: crisp-edges;
        cursor: crosshair;
      }
      #hud-root { position: absolute; inset: 0; pointer-events: none; }

      /* Milestone 4.1 Fix 1: inline boot thermometer. Present in the very first
         HTML paint, so it is visible at t=0ms before any ES module downloads. */
      #loading-screen {
        position: fixed; inset: 0; z-index: 9999;
        background: #05070d; display: flex; align-items: center; justify-content: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        transition: opacity 240ms linear;
      }
      #loading-screen .boot-title {
        font-size: 34px; font-weight: bold; letter-spacing: 8px;
        color: #38bdf8; text-shadow: 0 0 18px #22d3ee; margin-bottom: 6px;
      }
      #loading-screen .boot-sub {
        font-size: 10px; color: #64748b; letter-spacing: 3px; margin-bottom: 28px;
      }
      #loading-screen .boot-row { display: flex; align-items: flex-end; justify-content: center; gap: 18px; }
      #loading-screen .boot-tube {
        width: 26px; height: 220px; border: 2px solid #22d3ee; background: #0b1220;
        position: relative; box-shadow: 0 0 14px rgba(34,211,238,0.35);
      }
      #loading-fill {
        position: absolute; left: 2px; right: 2px; bottom: 2px; height: 0%;
        background: linear-gradient(0deg, #0ea5e9, #22d3ee, #fef08a);
        box-shadow: 0 0 14px #22d3ee; transition: height 120ms linear;
      }
      #loading-screen .boot-shimmer {
        position: absolute; inset: 4px; pointer-events: none;
        background: repeating-linear-gradient(0deg, transparent 0 12px, rgba(5,7,13,0.55) 12px 14px);
        background-size: 100% 28px; animation: bootShimmer 1.1s linear infinite;
      }
      #loading-screen .boot-info { text-align: left; width: 280px; }
      #loading-percent { font-size: 30px; color: #facc15; text-shadow: 0 0 12px #facc15; }
      #loading-stage { font-size: 11px; color: #e2e8f0; letter-spacing: 1px; min-height: 30px; margin-top: 8px; }
      #loading-screen .boot-foot { font-size: 9px; color: #475569; margin-top: 18px; }
      @keyframes bootShimmer { from { background-position-y: 0; } to { background-position-y: 28px; } }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="hud-root"></div>
    </div>

    <div id="loading-screen" role="status" aria-live="polite">
      <div style="text-align:center;color:#38bdf8;min-width:340px;">
        <div class="boot-title">BERZERK³</div>
        <div class="boot-sub">NEON ARCADE SYSTEM // BOOT SEQUENCE</div>
        <div class="boot-row">
          <div class="boot-tube">
            <div id="loading-fill"></div>
            <div class="boot-shimmer"></div>
          </div>
          <div class="boot-info">
            <div id="loading-percent">0%</div>
            <div id="loading-stage">LOADING ENGINE MODULES...</div>
            <div class="boot-foot">PRE-BAKING 24-ANGLE SPRITE STACK CACHES</div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
